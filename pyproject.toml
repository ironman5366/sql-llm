[project]
name = "sql-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "duckdb==1.5.2",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "openai==2.6.1",
    "orjson>=3.11.8",
    "partial-json-parser>=0.2.1.1.post7",
    "pillow>=12.2.0",
    "pybase64>=1.4.3",
    "pydantic>=2.13.3",
    "sentencepiece>=0.2.1",
    "sglang==0.5.10",
    "torch==2.9.1+cu128",
    "torchvision==0.24.1+cu128",
    "transformers==5.7.0",
    "trl>=1.3.0",
    "uvicorn>=0.46.0",
    "uvloop==0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"
override-dependencies = ["transformers==5.7.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
